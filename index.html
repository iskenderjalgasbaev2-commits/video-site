<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Presentation Bot | Iskender Jalg'asbaev</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0c2461;
            --accent: #2ecc71;
            --text: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }
        .icon-box {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        h1 { font-size: 2.5rem; margin: 0; }
        p { font-size: 1.1rem; opacity: 0.8; line-height: 1.6; }
        .steps {
            text-align: left;
            display: inline-block;
            margin: 1.5rem 0;
            padding: 0;
            list-style: none;
        }
        .steps li { margin: 10px 0; font-size: 1rem; }
        .steps li i { color: var(--accent); margin-right: 10px; }
        
        .btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            margin-top: 1rem;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.5);
            background: #27ae60;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">
        <i class="fas fa-file-powerpoint"></i>
    </div>
    <h1>PPTX Maker Bot</h1>
    <p>Professional prezentaciyalardı 1 minut ishinde avtomatikalıq túrde jaratıń!</p>
    
    <ul class="steps">
        <li><i class="fas fa-check-circle"></i> Temanı jiberiń</li>
        <li><i class="fas fa-check-circle"></i> Reje hám matndi jazıń</li>
        <li><i class="fas fa-check-circle"></i> Súwretler qosıń</li>
        <li><i class="fas fa-check-circle"></i> Tayar .pptx fayldı alıń!</li>
    </ul>

    <br>
    <a href="https://t.me/SIZDIN_BOT_USERNAME" class="btn">
        <i class="fab fa-telegram-plane"></i> BOTQA ÓTIW
    </a>

    <div class="footer">
        Jaratıwshı: Iskender Jalg'asbaev <br>
        &copy; 2026 Barlıq huquqlar qorǵalǵan.
    </div>
</div>

</body>
</html>
